name: Galactic Racing Phase 2-A performance and regression

on:
  push:
    branches:
      - feature/galactic-racing-phase2a-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix prototypes/galactic-racing-v2 --ignore-scripts
      - name: All historical golden tests and v0.4 checks
        run: |
          pnpm test:racing
          pnpm test:racing:v2
          pnpm test:racing:v3
          pnpm test:racing:v4
          node scripts/test-racing-phase1-ui.mjs
          node scripts/test-racing-polish.mjs
          node scripts/test-racing-render-loop.mjs
      - name: Build v0.4 standalone and main application
        run: |
          pnpm racing:build:v4
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm build
          git diff --check
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser interactions and actual screenshot capture
        run: node scripts/racing/screenshot-v4.mjs
      - name: Build frozen Phase 1 baseline in an independent worktree
        run: |
          git fetch --depth=1 origin fb600e51d9c8022b82f867511d915793770d9a9a
          git worktree add /tmp/racing-baseline fb600e51d9c8022b82f867511d915793770d9a9a
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/racing-baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/prototypes/galactic-racing-v2/node_modules" /tmp/racing-baseline/prototypes/galactic-racing-v2/node_modules
          (cd /tmp/racing-baseline && pnpm racing:build:v4)
          cp -r /tmp/racing-baseline/out/galactic-racing-phase1-v4 out/racing-performance-baseline
      - name: Actual before-after frame, CPU, draw-call and retained-memory measurements
        run: node scripts/racing/benchmark-rendering.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galactic-racing-phase2a-performance
          path: out/racing-phase2a-performance/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galactic-racing-v4-demo
          path: out/galactic-racing-phase1-v4/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galactic-racing-v4-screenshots
          path: out/galactic-racing-v4-qa/
          retention-days: 14
          if-no-files-found: warn
  windows-launcher:
    needs: replay-and-ui
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galactic-racing-v4-demo
          path: demo
      - name: Verify extracted Windows server and occupied port fail-closed
        shell: powershell
        run: |
          $script = Join-Path $pwd 'demo/serve-demo.ps1'
          $first = Start-Process powershell -ArgumentList "-NoProfile -File `"$script`" -NoBrowser -Port 43874" -PassThru
          $second = $null
          try {
            $ready=$false
            for($i=0;$i -lt 20;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:43874/build-info.json -UseBasicParsing; $ready=$true; break}catch{Start-Sleep -Milliseconds 300}}
            if(!$ready){throw 'Windows server did not start'}
            $info=$r.Content | ConvertFrom-Json
            if($info.sha -ne '${{ github.sha }}'){throw 'Wrong build served'}
            $conflict=Start-Process powershell -ArgumentList "-NoProfile -File `"$script`" -NoBrowser -Port 43874" -PassThru -Wait
            if($conflict.ExitCode -ne 1){throw 'Occupied port must fail without opening old server'}
            $second=Start-Process powershell -ArgumentList "-NoProfile -File `"$script`" -NoBrowser -Port 43875" -PassThru
            Start-Sleep -Seconds 2
            $r=Invoke-WebRequest http://127.0.0.1:43875/build-info.json -UseBasicParsing
            if(($r.Content | ConvertFrom-Json).sha -ne $info.sha){throw 'Alternate port build mismatch'}
            Write-Host 'PASS: Windows PowerShell server, exact SHA, port conflict, alternate port'
          } finally {
            Stop-Process -Id $first.Id -ErrorAction SilentlyContinue
            if($second){Stop-Process -Id $second.Id -ErrorAction SilentlyContinue}
          }
