name: Scheduled news collection

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holocron-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger production collection
        shell: bash
        env:
          HOLOCRON_SCHEDULER_SECRET: ${{ secrets.HOLOCRON_SCHEDULER_SECRET }}
          HOLOCRON_SCHEDULER_URL: https://holocron-korea.hyperspace0729.chatgpt.site/api/scheduled/collect
        run: |
          set -euo pipefail
          test -n "${HOLOCRON_SCHEDULER_SECRET}"
          response_file="${RUNNER_TEMP}/holocron-scheduled-response.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --connect-timeout 10 \
            --max-time 1200 \
            --max-redirs 0 \
            --header "Authorization: Bearer ${HOLOCRON_SCHEDULER_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output "${response_file}" \
            "${HOLOCRON_SCHEDULER_URL}"
          status="$(jq -r '.status // empty' "${response_file}")"
          case "${status}" in
            success|partial|skipped) ;;
            *) echo "Unexpected scheduler response" >&2; exit 1 ;;
          esac
          jq '{status, reason, count, startedAt, finishedAt}' "${response_file}"
