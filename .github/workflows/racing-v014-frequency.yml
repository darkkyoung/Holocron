name: Galactic Racing v0.14 Frequency
on:
  push:
    branches: [feature/galactic-racing-v014-ultimate-frequency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/racing/balance-v14.mjs 40000 14holdout- out/racing-v14-balance.json
      - uses: actions/upload-artifact@v4
        with:
          name: racing-v014-independent-holdout
          path: out/racing-v14-balance.json
          retention-days: 30
  regression-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: |
          pnpm install --frozen-lockfile
          npm ci --prefix prototypes/galactic-racing-v2 --ignore-scripts
      - name: Historical golden and v0.14 presentation regression
        run: |
          pnpm test:racing
          pnpm test:racing:v2
          pnpm test:racing:v3
          pnpm test:racing:v4
          pnpm test:racing:v5
          pnpm test:racing:v6
          node scripts/test-racing-v7.mjs
          node scripts/test-racing-c1-presentation.mjs
          node scripts/test-racing-v8.mjs
          node scripts/test-racing-d1.mjs
          node scripts/test-racing-tv-path.mjs
          node scripts/test-racing-d11.mjs
          node scripts/test-racing-v9.mjs
          node scripts/test-racing-final.mjs
          node scripts/test-racing-v10.mjs
          node scripts/test-racing-v11.mjs
          node scripts/test-racing-v12.mjs
          node scripts/test-racing-v13.mjs
          node scripts/test-racing-v14.mjs
          node scripts/test-racing-render-loop.mjs
          node scripts/test-racing-phase1-ui.mjs
          node scripts/test-racing-polish.mjs
      - name: Build and static checks
        run: |
          node scripts/racing/serve-watch-v14.mjs --build-only
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm build
          git diff --check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Actual Chromium motion, mobile, fullscreen and overlapping-camera QA
        run: node scripts/racing/screenshot-v14.mjs
      - name: Pinned v0.13 software-renderer comparison
        run: |
          git fetch --depth=1 origin d0ea1f3839b12ce853258ae954f911d4aa9901ae
          git worktree add /tmp/racing-v13-baseline d0ea1f3839b12ce853258ae954f911d4aa9901ae
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/racing-v13-baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/prototypes/galactic-racing-v2/node_modules" /tmp/racing-v13-baseline/prototypes/galactic-racing-v2/node_modules
          (cd /tmp/racing-v13-baseline && node scripts/racing/serve-watch-v13.mjs --build-only)
          cp -r /tmp/racing-v13-baseline/out/galactic-racing-phase2-v13 out/racing-performance-baseline
          xvfb-run -a -s "-screen 0 1920x1080x24" env RACING_BENCH_HEADED=1 RACING_BENCH_AFTER=out/galactic-racing-phase2-v14 RACING_BENCH_OUTPUT=out/racing-v014-performance RACING_BENCH_CYCLES=3 RACING_BENCH_SCENARIOS=normal-corner,ultimate,fullscreen-large,phantom-afterburn node scripts/racing/benchmark-rendering.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racing-v014-performance-evidence
          path: out/racing-v014-performance/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racing-v014-browser-evidence
          path: out/galactic-racing-v14-qa/
          retention-days: 30
      - name: Freeze exact Windows executable ZIP and digest
        run: |
          cd out/galactic-racing-phase2-v14
          zip -q -r ../Galactic-Racing-v0.14-${GITHUB_SHA:0:12}-Windows.zip .
          cd ..
          sha256sum Galactic-Racing-v0.14-*-Windows.zip > v014-windows-sha256.txt
          cat v014-windows-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-Racing-v014-Windows-ZIP
          path: |
            out/Galactic-Racing-v0.14-*-Windows.zip
            out/v014-windows-sha256.txt
          retention-days: 30
  windows-chrome:
    needs: regression-demo
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install browser QA dependencies
        shell: powershell
        run: |
          $chrome = @((Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'), (Join-Path ${env:ProgramFiles(x86)} 'Google/Chrome/Application/chrome.exe')) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(!$chrome){throw 'Windows Chrome unavailable'}
          "RACING_QA_EXECUTABLE=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: Galactic-Racing-v014-Windows-ZIP
          path: package
      - name: Check exact bytes, build SHA, port collision and alternate port
        shell: powershell
        run: |
          $zip=(Get-ChildItem package/Galactic-Racing-v0.14-*-Windows.zip | Select-Object -First 1)
          $line=(Get-Content package/v014-windows-sha256.txt).Split(' ')[0]
          if((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $line){throw 'ZIP SHA256 mismatch'}
          Expand-Archive $zip.FullName demo
          $script=Join-Path $pwd 'demo/serve-demo.ps1'
          $first=Start-Process powershell -ArgumentList @('-NoProfile','-File',$script,'-NoBrowser','-Port','43874') -PassThru
          $second=$null
          try {
            $ready=$false
            for($i=0;$i -lt 30;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:43874/build-info.json -UseBasicParsing;$ready=$true;break}catch{Start-Sleep -Milliseconds 300}}
            if(!$ready){throw 'Windows launcher did not start'}
            $info=$r.Content | ConvertFrom-Json
            if($info.sha -ne $env:GITHUB_SHA -or $info.dirty -or $info.simulator -ne 'galactic-racing-0.14.0'){throw 'Wrong SHA/version'}
            $conflict=Start-Process powershell -ArgumentList @('-NoProfile','-File',$script,'-NoBrowser','-Port','43874') -PassThru -Wait
            if($conflict.ExitCode -ne 1){throw 'Occupied port not rejected'}
            $second=Start-Process powershell -ArgumentList @('-NoProfile','-File',$script,'-NoBrowser','-Port','43875') -PassThru
            Start-Sleep -Seconds 2
            $alternate=Invoke-WebRequest http://127.0.0.1:43875/build-info.json -UseBasicParsing
            if(($alternate.Content | ConvertFrom-Json).sha -ne $info.sha){throw 'Alternate port mismatch'}
          } finally {Stop-Process -Id $first.Id -ErrorAction SilentlyContinue;if($second){Stop-Process -Id $second.Id -ErrorAction SilentlyContinue}}
      - name: Actual Windows Chrome software GPU functional QA
        env:
          RACING_QA_ROOT: demo
          RACING_QA_OUTPUT: out/racing-v14-windows-qa
        run: node scripts/racing/screenshot-v14.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racing-v014-windows-chrome-evidence
          path: out/racing-v14-windows-qa/
          retention-days: 30
