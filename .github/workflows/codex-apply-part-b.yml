name: Apply Part B maintenance patch

on:
  push:
    branches:
      - codex-source-adapters-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage Part B patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch
        run: base64 -d .github/workflows/codex-part-b.patch.b64 | gzip -d > /tmp/codex-part-b.patch
      - name: Apply and push Part B
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git apply --check /tmp/codex-part-b.patch
          git apply /tmp/codex-part-b.patch
          git config user.name "darkkyoung"
          git config user.email "darkkyoung@users.noreply.github.com"
          git add -A
          git commit -m "Refactor news source adapters"
          git push origin main
