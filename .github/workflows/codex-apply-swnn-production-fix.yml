name: Apply SWNN production fix

on:
  push:
    branches:
      - codex-swnn-production-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply validated patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/swnn-production-fix.patch
          git apply --index /tmp/swnn-production-fix.patch
      - name: Commit and push
        run: |
          git config user.name "darkkyoung"
          git config user.email "darkkyoung@users.noreply.github.com"
          git commit -m "Fix SWNN production image enrichment"
          git push origin HEAD:main

